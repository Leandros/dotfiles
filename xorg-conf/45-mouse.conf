# Mice 15 % slower than libinput's default. Installed by bootstrap.sh.
#
# On a mouse libinput's speed setting moves only the acceleration threshold
# and the maximum, not slow movements, so this is a custom curve: 0.85
# times libinput's adaptive mouse profile at speed 0, the default
# (libinput 1.32, src/filter-mouse.c): factor 10 v + 0.3 below 0.07
# units/ms, 1 up to the threshold 0.4, then 1.1 (v - 0.4) + 1 up to 2.
# Points are output speeds for v = 0, 0.025, ... 1.575 units/ms; libinput
# continues the last (linear) segment. The custom curve gets raw device
# units, the adaptive one 1000 dpi units: the same for mice without a
# MOUSE_DPI in udev's hwdb. sway has the same at its speed -0.27
# (.config/sway/config). Checked by test/mouse-accel/test.sh.
# The TrackPoint keeps libinput's default; touchpads are in
# 40-touchpad.conf. Drivers without custom profiles (xf86-input-libinput
# < 1.3) ignore it and keep the default curve.
Section "InputClass"
    Identifier "mouse 15 % slower"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    NoMatchProduct "TrackPoint"
    MatchDriver "libinput"
    Option "AccelProfile" "custom"
    Option "AccelStepMotion" "0.025"
    Option "AccelPointsMotion" "0.0 0.0117 0.034 0.0638 0.085 0.1062 0.1275 0.1488 0.17 0.1913 0.2125 0.2338 0.255 0.2762 0.2975 0.3187 0.34 0.3712 0.4035 0.4371 0.4717 0.5076 0.5446 0.5828 0.6222 0.6627 0.7044 0.7473 0.7914 0.8366 0.8829 0.9305 0.9792 1.0291 1.0801 1.1324 1.1858 1.2403 1.296 1.3529 1.411 1.4702 1.5306 1.5922 1.655 1.7189 1.7839 1.8502 1.9176 1.9862 2.0559 2.1269 2.1989 2.2525 2.295 2.3375 2.38 2.4225 2.465 2.5075 2.55 2.5925 2.635 2.6775"
EndSection
