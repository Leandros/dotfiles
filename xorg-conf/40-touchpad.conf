# Touchpads behave as on macOS. Installed by bootstrap.sh.
#
# - Click by pressing the pad; tapping is off. `~/bin/touchpad tap` turns
#   tap-to-click on for the session.
# - Two-finger click is a right click, three-finger a middle click, anywhere
#   on the pad (clickfinger, not the bottom-corner button areas).
# - Acceleration: macOS uses a power curve; slow motions stay precise and
#   fast swipes cross the screen. The shape is the one proposed for a
#   macOS-like libinput touchpad curve (libinput MR 426):
#     gain = 0.2 * (25.4 * v) ^ 0.55, v in units/ms (1000 dpi), 25.4 * v in mm/s
#   times 2: macOS moves the pointer in points, 2 pixels each on a Retina
#   panel; X moves it in pixels, and the P14s panel (250 ppi) is as dense.
#   Points are output speeds v * gain * 2 for v = 0, 0.5, ... 8; libinput
#   continues the last segment for faster motion. Try changes live with
#   `xinput set-prop --type=float --format=32 <id>
#   'libinput Accel Custom Motion Points' 0 0.809 ...` (one argument per
#   point; while the property is still empty xinput needs the type).
#   Drivers without custom profiles (xf86-input-libinput < 1.3) ignore it
#   and keep the default curve.
Section "InputClass"
    Identifier "touchpad macOS"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "off"
    Option "ClickMethod" "clickfinger"
    Option "AccelProfile" "custom"
    Option "AccelStepMotion" "0.5"
    Option "AccelPointsMotion" "0.0 0.809 2.37 4.443 6.939 9.807 13.009 16.521 20.319 24.389 28.716 33.287 38.094 43.126 48.375 53.835 59.499"
EndSection
