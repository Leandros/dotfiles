# Touchpads behave as on macOS. Installed by bootstrap.sh.
#
# - Click by pressing the pad; tapping is off. `~/bin/touchpad tap` turns
#   tap-to-click on for the session. Tap-and-drag stays off: a touch soon
#   after a tap would hold the button and drag what is under the cursor.
#   Drag by pressing the pad and moving.
# - Two-finger click is a right click, three-finger a middle click, anywhere
#   on the pad (clickfinger, not the bottom-corner button areas).
# - Acceleration: macOS's trackpad curve at tracking speed 0.6875 (the
#   fourth notch from the left in System Settings). Apple's parametric curve
#   (IOHIDFamily IOHIDParametricAcceleration, the AppleMultitouchTrackpad
#   HIDAccelCurves row 0.6875: GainLinear 0.96, GainParabolic 0.83,
#   GainCubic 0.12, TangentSpeedLinear 7.1, TangentSpeedParabolicRoot 18;
#   table and evaluation from
#   https://github.com/iam4x/omarchy-macbookpro-m1-trackpad) moves the
#   cursor 96 * f(v) points/s for a finger speed of v inch/s:
#     f(v) = 0.96 v + (0.83 v)^2 + (0.12 v)^3 up to 7.1, then the tangent
#     line up to 18, then a square root.
#   Converted to the same screen distance on the ThinkPad P14s Gen 6:
#   libinput gives custom curves raw device units (this pad: 12 units/mm,
#   no 1000 dpi normalization); a macOS point is 0.1997 mm (Retina, 2x);
#   sway moves the pointer in logical pixels, 0.1525 mm on the 14.5"
#   3072x1920 panel at scale 1.5 (factor 1.31). X moves it in physical
#   pixels (0.1017 mm), so with the same points the cursor in i3 covers
#   2/3 of sway's distance.
#   Points are output speeds for v = 0, 0.5, ... 16 units/ms (0 to 1333
#   mm/s); libinput continues the last segment for faster motion. Before
#   (2026-11) a hand-tuned power curve; this is 10-15 % slower up to 170
#   mm/s and the same at 300-500 mm/s. The sway config has the same points
#   (test/touchpad/test.sh). Try changes live with
#   `xinput set-prop --type=float --format=32 <id>
#   'libinput Accel Custom Motion Points' 0 0.432 ...` (one argument per
#   point; while the property is still empty xinput needs the type).
#   Drivers without custom profiles (xf86-input-libinput < 1.3) ignore it
#   and keep the default curve.
Section "InputClass"
    Identifier "touchpad macOS"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "off"
    Option "TappingDrag" "off"
    Option "ClickMethod" "clickfinger"
    Option "AccelProfile" "custom"
    Option "AccelStepMotion" "0.5"
    Option "AccelPointsMotion" "0.0 0.432 1.336 2.717 4.582 6.825 9.095 11.364 13.633 15.903 18.172 20.441 22.591 24.553 26.369 28.068 29.670 31.190 32.639 34.027 35.360 36.644 37.886 39.087 40.253 41.386 42.489 43.564 44.613 45.638 46.640 47.621 48.583"
EndSection
