# Touchpads behave as on macOS. Installed by bootstrap.sh.
#
# - Click by pressing the pad; tapping is off. `~/bin/touchpad tap` turns
#   tap-to-click on for the session.
# - Two-finger click is a right click, three-finger a middle click, anywhere
#   on the pad (clickfinger, not the bottom-corner button areas).
# - Acceleration: macOS moves slowly for small motions and much faster for
#   fast ones. This custom curve approximates it: the gain is 0.8 + 0.5 *
#   speed, so small motions move at 0.8x and a fast swipe at 2.8x and more.
#   Points are the output speed at input speeds 0, 0.5, ... 4 (units/ms);
#   libinput continues the last segment for faster motion. Try changes live
#   with `xinput set-prop --type=float --format=32 <id>
#   'libinput Accel Custom Motion Points' 0 0.525 ...` (one argument per
#   point; while the property is still empty xinput needs the type).
#   Drivers without custom profiles (xf86-input-libinput < 1.3) ignore it
#   and keep the default curve.
Section "InputClass"
    Identifier "touchpad macOS"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "off"
    Option "ClickMethod" "clickfinger"
    Option "AccelProfile" "custom"
    Option "AccelStepMotion" "0.5"
    Option "AccelPointsMotion" "0.0 0.525 1.3 2.325 3.6 5.125 6.9 8.925 11.2"
EndSection
