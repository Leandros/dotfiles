# Key repeat for every keyboard the server adds, including ones that appear
# after login such as the xremap virtual device. `xset r rate` only reaches
# devices present when it runs. Installed by bootstrap.sh.
#
# Values: delay in ms, then the interval between repeats in ms (the server
# stores the second value as the interval; 33 ms = 30 repeats/s).
Section "InputClass"
    Identifier "keyboard repeat"
    MatchIsKeyboard "on"
    Option "AutoRepeat" "180 33"
EndSection
