# Ghostty on Linux: the keys and window settings of .wezterm.lua.
#
# bootstrap.sh links this file to ~/.config/ghostty/linux.conf on Fedora
# desktops (i3 and sway); ~/.config/ghostty/config includes it last
# (`config-file = ?linux.conf`, resolved next to that link). It lives
# outside .config/ghostty so a macOS setup that links that directory does
# not get it. Test: test/ghostty/test.sh.
#
# Alt is the physical Ctrl key: XKB (sway) and xremap (i3) swap left Alt and
# Ctrl, and Super belongs to the window manager, as in wezterm's `ctrlkey`.

# i3 and sway draw the window frames.
window-decoration = none

# No visual bell; the window manager still gets the urgency hint.
bell-features = no-system,no-audio,attention,no-title,no-border
# wezterm shows no toast on copy.
app-notifications = no-clipboard-copy

# sway's touchpad scroll_factor is 0.1 (5x slower than 0.5, for Chromium
# and wezterm); ghostty scrolls by pixels like Firefox, which gets 5x too.
mouse-scroll-multiplier = precision:5,discrete:3

# wezterm: disable_default_key_bindings.
keybind = clear

# Tabs, windows, clipboard.
keybind = alt+1=goto_tab:1
keybind = alt+2=goto_tab:2
keybind = alt+3=goto_tab:3
keybind = alt+4=goto_tab:4
keybind = alt+5=goto_tab:5
keybind = alt+6=goto_tab:6
keybind = alt+7=goto_tab:7
keybind = alt+8=goto_tab:8
keybind = alt+9=last_tab
keybind = alt+shift+t=new_tab
keybind = alt+shift+w=close_tab
keybind = alt+shift+n=new_window
keybind = alt+shift+q=quit
keybind = ctrl+shift+p=toggle_command_palette
# The selection also goes to the primary selection (copy-on-select).
keybind = alt+shift+c=copy_to_clipboard
keybind = alt+shift+v=paste_from_clipboard
keybind = shift+insert=paste_from_clipboard

# Leader Alt+e, as wezterm's (tmux-like). Ghostty waits for the second key
# without a timeout (wezterm: 1 s). wezterm's launch-menu choosers are
# empty on Linux, so c, i, t and g open the default shell.
keybind = alt+e>c=new_tab
keybind = alt+e>i=new_split:right
keybind = alt+e>g=new_split:right
keybind = alt+e>t=new_split:down
# Bone 2 directions, as in nvim: b r n s = left up down right.
keybind = alt+e>b=goto_split:left
keybind = alt+e>s=goto_split:right
keybind = alt+e>n=goto_split:down
keybind = alt+e>r=goto_split:up
# Resize in pixels (wezterm: 10 cells).
keybind = alt+e>shift+b=resize_split:left,100
keybind = alt+e>shift+s=resize_split:right,100
keybind = alt+e>shift+n=resize_split:down,100
keybind = alt+e>shift+r=resize_split:up,100
keybind = alt+e>1=goto_tab:1
keybind = alt+e>2=goto_tab:2
keybind = alt+e>3=goto_tab:3
keybind = alt+e>4=goto_tab:4
keybind = alt+e>5=goto_tab:5
keybind = alt+e>6=goto_tab:6
keybind = alt+e>7=goto_tab:7
keybind = alt+e>8=goto_tab:8
keybind = alt+e>9=last_tab
keybind = alt+e>z=toggle_split_zoom
keybind = alt+e>d=close_surface
keybind = alt+e>[=activate_key_table:copy

# Copy mode, partial: ghostty has no cursor that moves without a selection.
# b r n s move an existing selection (made with the mouse or a search),
# N / R scroll a line, ( / ) a page; / searches, ? and - go to the previous
# and next match; y copies and stays, Y copies and leaves; q, Escape,
# Ctrl+c and Ctrl+g leave. Other keys do nothing while it is active.
keybind = copy/catch_all=ignore
keybind = copy/b=adjust_selection:left
keybind = copy/s=adjust_selection:right
keybind = copy/r=adjust_selection:up
keybind = copy/n=adjust_selection:down
keybind = copy/shift+n=scroll_page_lines:1
keybind = copy/shift+r=scroll_page_lines:-1
keybind = copy/(=scroll_page_down
keybind = copy/)=scroll_page_up
keybind = copy//=start_search
keybind = copy/?=navigate_search:previous
keybind = copy/-=navigate_search:next
keybind = copy/y=copy_to_clipboard
keybind = copy/shift+y=copy_to_clipboard
keybind = chain=end_search
keybind = chain=deactivate_key_table
keybind = chain=scroll_to_bottom
keybind = copy/q=end_search
keybind = chain=deactivate_key_table
keybind = chain=scroll_to_bottom
keybind = copy/escape=end_search
keybind = chain=deactivate_key_table
keybind = chain=scroll_to_bottom
keybind = copy/ctrl+c=end_search
keybind = chain=deactivate_key_table
keybind = chain=scroll_to_bottom
keybind = copy/ctrl+g=end_search
keybind = chain=deactivate_key_table
keybind = chain=scroll_to_bottom
