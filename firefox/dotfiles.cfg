// Firefox autoconfig (bootstrap.sh; firefox/autoconfig.js loads it). Firefox skips this first line.
//
// sway's touchpad scroll_factor is 0.1 (.config/sway/config): Chromium and
// terminals scrolled too fast at 0.5. Firefox scrolls by that distance too,
// so in sway it scales its scrolling up again and needs less travel for the
// back/forward swipe (both 5x, for 0.5 -> 0.1). Other sessions (i3) keep
// Firefox's defaults. These are defaults: a value set in about:config wins.
// Float prefs are strings in Firefox's pref store, so the swipe sizes are too.

// Middle button, in every session: drag-scroll (autoscroll) instead of
// pasting the primary selection.
defaultPref("general.autoScroll", true);
defaultPref("middlemouse.paste", false);

if (getenv("SWAYSOCK")) {
    defaultPref("mousewheel.default.delta_multiplier_y", 500);
    defaultPref("widget.swipe.page-size", "8.0");
    defaultPref("widget.swipe.pixel-size", "220.0");
}
