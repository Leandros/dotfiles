# fuzzel: the program launcher ($mod+i) and the clipboard history picker
# (~/bin/clip-pick, $mod+c) of the sway session.

[main]
font=Menlo:size=12
# Programs with Terminal=true run in ~/bin/term. fuzzel runs the command
# without a shell: sh expands $HOME, and the program follows as "$@".
terminal=sh -c 'exec "$HOME/bin/term" -e "$@"' term
# Solarized dark or light: ~/bin/theme writes the [colors] section there.
# A missing file is an error for `fuzzel --check-config` only; fuzzel logs
# it and starts with the other settings.
include=~/.local/state/theme/fuzzel.ini
