# picom: compositor for i3, only for tear-free drawing. Without one, X
# draws each window straight to the screen, out of step with the refresh
# (Firefox tore when scrolling), and modesetting in Xorg 21.1 has no
# TearFree option. ~/.xprofile starts it; bootstrap.sh links this file.
#
# Kept to options picom 9 (Ubuntu 22.04, Debian 12) and 13 (Fedora) share.

# Draw with OpenGL, in step with the display refresh.
backend = "glx";
vsync = true;

# Redraw only what changed; full-screen windows (video, games) bypass it.
use-damage = true;
unredir-if-possible = true;

# No effects: i3 needs none, and they cost battery.
shadow = false;
fading = false;
