# Shared with macOS (linked by hand there). On Linux desktops bootstrap
# (install_alacritty) links this file, themes/ and alacritty/linux.toml,
# which holds .wezterm.lua's Linux keys. Checked by test/alacritty/test.sh.

[general]
live_config_reload = true
# Imports load first, this file last. The dark theme, then the link that
# ~/bin/alacritty-theme points at the desktop's light or dark scheme
# (Linux; without it the theme stays dark), then the Linux part. Missing
# imports are skipped; Alacritty reloads when one changes.
import = [
    "themes/solarized-dark.toml",
    "~/.local/state/alacritty/theme.toml",
    "linux.toml",
]

[bell]
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[cursor.style]
blinking = "Off"
shape = "Block"

[env]
TERM = "xterm-256color"

# Set `defaults write org.alacritty AppleFontSmoothing -int 0` to disable FontSmoothing
# and therefore reduce the "thickness" of the font rendered.
[font]
size = 14.0
builtin_box_drawing = true

[font.bold]
family = "PragmataPro Mono"
style = "Bold"

[font.bold_italic]
family = "PragmataPro Mono Liga"
style = "Bold Italic"

[font.italic]
family = "PragmataPro Mono Liga"
style = "Italic"

[font.normal]
family = "PragmataPro Mono Liga"
style = "Regular"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true
semantic_escape_chars = ''',│`|:"' ()[]{}<>	'''

[window]
dynamic_title = true
padding = { x = 10, y = 10 }
dimensions = { columns = 120, lines = 30 }

# Imports add their bindings to these (arrays are appended).
[keyboard]
bindings = [
    { key = "C", mods = "Control", chars = "\u0003" },
]
