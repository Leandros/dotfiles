# i3bar: the fallback status bar where eww is not installed. bootstrap.sh
# links this file into ~/.config/i3-bar.d, which the i3 config includes;
# the colors are its variables.
bar {
    position            top
    # No tray_output: i3bar puts the tray on the first active output. With
    # "primary" the tray disappears when no output is primary, which X does
    # not set by default. i3bar shows the tray on one output only.
    # Enable again, if blueman or CopyQ do not appear.
    # tray_output         primary
    font pango:Menlo 10
    # i3status plus a clickable keyboard layout block.
    status_command      ~/bin/i3status-kb

    colors {
        separator       $blue
        background      $baseA3
        statusline      $baseB2

        # class                 border  bg      text
        focused_workspace       $green  $green  $baseA3
        active_workspace        $custom $custom $baseA2
        inactive_workspace      $baseA2 $baseA2 $baseB2
        urgent_workspace        $orange $orange $baseB3
    }
}
