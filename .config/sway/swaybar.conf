# swaybar: the fallback status bar where eww is not installed. bootstrap.sh
# links this file into ~/.config/sway-bar.d, which the sway config includes;
# the colors are its variables.
bar {
    position            top
    # No tray_output: swaybar shows the tray (StatusNotifierItem only) on
    # every output.
    font pango:Menlo 10
    # i3status plus a clickable keyboard layout block.
    status_command      ~/bin/i3status-kb

    colors {
        separator       $blue
        background      $baseA3
        statusline      $baseB2

        # class                 border  bg      text
        focused_workspace       $green  $green  $baseA3
        active_workspace        $custom $custom $baseA2
        inactive_workspace      $baseA2 $baseA2 $baseB2
        urgent_workspace        $orange $orange $baseB3
    }
}
