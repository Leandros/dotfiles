[package]
name = "tmux-flash"
version = "0.1.0"
edition = "2024"
description = "Jump labels for tmux panes, with the rules of flash.nvim"
publish = false

[dependencies]
crossterm = "0.29.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_results = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Items are pub(crate) to state their visibility (unreachable_pub); this
# nursery lint asks for the opposite.
redundant_pub_crate = "allow"
# Restriction lints: no panics outside tests, no lossy casts, no byte
# slicing of UTF-8 text, no stray output.
as_conversions = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
