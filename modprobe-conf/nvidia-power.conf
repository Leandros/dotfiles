# Installed by bootstrap.sh to /etc/modprobe.d/ where an NVIDIA GPU exists.
# Applies when the nvidia module loads next (after a reboot).
#
# S0ix: the GPU powers off in s2idle (suspend), so the SoC reaches its
# deepest idle state. Check: grep S0ix /proc/driver/nvidia/gpus/*/power
options nvidia NVreg_EnableS0ixPowerManagement=1
# Runtime D3: the GPU powers off while idle, where the platform supports it.
options nvidia NVreg_DynamicPowerManagement=0x02
# Video memory is saved across suspend to a file in TemporaryFilePath (on
# disk, not tmpfs: it can be GBs). Needs the driver's nvidia-suspend,
# nvidia-resume and nvidia-hibernate units.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
